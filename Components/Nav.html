<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>

           * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

         .top-navbar {
            height: 70px;

            width: calc(100% - 250px);

            position: fixed;

            top: 0;
            right: 0;

            z-index: 900;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 28px;

            background: #ffffff;

            border-bottom: 1px solid #f0f2f5;
        }


        /* Page Title */

        .page-title {
            margin: 0;

            font-size: 15px;
            font-weight: 600;

            color: #343c6a;
        }


        /* Right Side */

        .nav-right {
            display: flex;
            align-items: center;

            gap: 12px;
        }


        /* Search */

        .search-box {
            width: 130px;
            height: 38px;

            display: flex;
            align-items: center;

            gap: 8px;

            padding: 0 12px;

            border-radius: 50px;

            background: #f5f7fa;
        }

        .search-box i {
            flex-shrink: 0;

            font-size: 11px;

            color: #718ebf;
        }

        .search-box input {
            width: 100%;
            min-width: 0;

            border: none;
            outline: none;

            background: transparent;

            font-size: 9px;

            color: #718ebf;
        }

        .search-box input::placeholder {
            color: #718ebf;
        }


        /* Icon Buttons */

        .nav-icon {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 50%;

            background: #f5f7fa;

            color: #718ebf;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .nav-icon:hover {
            color: #3155e7;
        }


        /* Notification */

        .notification {
            position: relative;
        }

        .notification span {
            position: absolute;

            top: 7px;
            right: 8px;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #ff4b55;
        }


        /* Profile */

        .profile {
            width: 38px;
            height: 38px;

            flex-shrink: 0;

            margin-left: 4px;

            overflow: hidden;

            border-radius: 50%;
        }

        .profile img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

    </style>
</head>
<body>
     <nav class="top-navbar">

        <h2 class="page-title">
            Overview
        </h2>


        <div class="nav-right">

            <div class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" placeholder="Search for something">

            </div>


            <button class="nav-icon" type="button">
                <i class="fa-solid fa-gear"></i>
            </button>


            <button class="nav-icon notification" type="button">

                <i class="fa-regular fa-bell"></i>

                <span></span>

            </button>


            <div class="profile">

                <img src="https://i.pravatar.cc/100?img=47" alt="Profile">

            </div>

        </div>

    </nav>

<script src="JS/Components.js"></script>
</body>
</html>
