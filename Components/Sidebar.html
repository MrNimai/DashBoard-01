<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

           * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

         /* ================================
           SIDEBAR
        ================================= */

        .sidebar {
            width: 250px;
            height: 100vh;

            position: fixed;
            top: 0;
            left: 0;

            z-index: 1000;

            background: #ffffff;
            border-right: 1px solid #eeeeee;

            padding-top: 30px;
        }


        /* Logo */

        .sidebar-logo {
            display: flex;
            align-items: center;

            gap: 7px;

            padding-left: 20px;
            margin-bottom: 32px;

            color: #1d2a5b;
        }

        .sidebar-logo i {
            font-size: 20px;
            color: #3155e7;
        }

        .sidebar-logo span {
            font-size: 17px;
            font-weight: 700;
        }


        /* Navigation */

        .sidebar-nav {
            display: flex;
            flex-direction: column;
        }


        /* Nav Item */

        .nav-item {
            position: relative;

            height: 46px;

            display: flex;
            align-items: center;

            gap: 15px;

            padding: 0 22px;

            color: #aaaaaa;

            text-decoration: none;

            font-size: 12px;
            font-weight: 400;

            transition: 0.25s ease;
        }

        .nav-item i {
            width: 18px;

            text-align: center;

            font-size: 14px;
        }


        /* Hover */

        .nav-item:hover {
            color: #3155e7;
            background: #f7f9ff;
        }


        /* Active */

        .nav-item.active {
            color: #3155e7;

            font-weight: 500;

            background: #ffffff;
        }

        .nav-item.active::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;

            width: 3px;
            height: 46px;

            background: #3155e7;

            border-radius: 0 4px 4px 0;
        }

        .nav-item.active i {
            color: #3155e7;
        }


    </style>
</head>
<body>
      <!-- =================================================
         SIDEBAR
    ================================================== -->

            <span>BankDash.</span>

        </div>


        <nav class="sidebar-nav">

            <a href="index.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="Transactions.html" class="nav-item">
                <i class="fa-solid fa-money-bill-transfer"></i>
                <span>Transactions</span>
            </a>

            <a href="Accounts.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Accounts</span>
            </a>

            <a href="Investments.html" class="nav-item">
                <i class="fa-solid fa-chart-column"></i>
                <span>Investments</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-credit-card"></i>
                <span>Credit Cards</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-hand-holding-dollar"></i>
                <span>Loans</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-screwdriver-wrench"></i>
                <span>Services</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-hand-holding-heart"></i>
                <span>My Privileges</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>Setting</span>
            </a>

        </nav>

    </aside>


    <script src="JS/Components.js"></script>
</body>
</html>
