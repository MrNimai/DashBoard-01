<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BankDash Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="Styles/Settings.css">
    <link rel="stylesheet" href="Styles/Global.css">
</head>


<body>
    <div id="Sidebar"></div>
    <div id="Nav"></div>

  <main class="main-content">

    <div class="row-2">

        <form class="row-2-form">

            <!-- Profile Image -->
            <div class="row-2-profile">
                <div class="row-2-avatar">

                    <div class="row-2-avatar-placeholder">
                        <span>CR</span>
                    </div>

                    <button type="button" class="row-2-edit">
                        <svg viewBox="0 0 24 24">
                            <path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3Z"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="1.8"
                                  stroke-linecap="round"
                                  stroke-linejoin="round"/>

                            <path d="m14 8 2 2"
                                  fill="none"
                                  stroke="currentColor"
                                  stroke-width="1.8"
                                  stroke-linecap="round"/>
                        </svg>
                    </button>

                </div>
            </div>


            <!-- Form Fields -->
            <div class="row-2-fields">

                <div class="row-2-field">
                    <label for="name">Your Name</label>
                    <input
                        id="name"
                        class="row-2-input"
                        type="text"
                        name="name"
                        value="Charlene Reed"
                    >
                </div>


                <div class="row-2-field">
                    <label for="username">User Name</label>
                    <input
                        id="username"
                        class="row-2-input"
                        type="text"
                        name="username"
                        value="Charlene Reed"
                    >
                </div>


                <div class="row-2-field">
                    <label for="email">Email</label>
                    <input
                        id="email"
                        class="row-2-input"
                        type="email"
                        name="email"
                        value="charlenereed@gmail.com"
                    >
                </div>


                <div class="row-2-field">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        class="row-2-input"
                        type="password"
                        name="password"
                        value="1234567890"
                    >
                </div>


                <div class="row-2-field">
                    <label for="dob">Date of Birth</label>

                    <input
                        id="dob"
                        class="row-2-input"
                        type="date"
                        name="dob"
                        value="1990-01-25"
                    >
                </div>


                <div class="row-2-field">
                    <label for="present-address">Present Address</label>

                    <input
                        id="present-address"
                        class="row-2-input"
                        type="text"
                        name="present-address"
                        value="San Jose, California, USA"
                    >
                </div>


                <div class="row-2-field">
                    <label for="permanent-address">Permanent Address</label>

                    <input
                        id="permanent-address"
                        class="row-2-input"
                        type="text"
                        name="permanent-address"
                        value="San Jose, California, USA"
                    >
                </div>


                <div class="row-2-field">
                    <label for="city">City</label>

                    <input
                        id="city"
                        class="row-2-input"
                        type="text"
                        name="city"
                        value="San Jose"
                    >
                </div>


                <div class="row-2-field">
                    <label for="postal-code">Postal Code</label>

                    <input
                        id="postal-code"
                        class="row-2-input"
                        type="text"
                        name="postal-code"
                        value="45962"
                    >
                </div>


                <div class="row-2-field">
                    <label for="country">Country</label>

                    <input
                        id="country"
                        class="row-2-input"
                        type="text"
                        name="country"
                        value="USA"
                    >
                </div>

            </div>


            <!-- Save -->
            <div class="row-2-save-area">
                <button type="submit" class="row-2-save">
                    Save
                </button>
            </div>

        </form>

    </div>

</main>


    <!-- =================================================
         FONT AWESOME
    ================================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
    <script src="JS/Components.js"></script>


</body>

</html>
